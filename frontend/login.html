<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3f2f1">
  <title>登录 · StudyFlow</title>
  <script>
    (function () {
      try {
        var follow = localStorage.getItem("studyflow.settings.follow-system");
        var stored = localStorage.getItem("studyflow.settings.theme");
        var dark = follow === "false"
          ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#202020";
        }
      } catch (_) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="stylesheet" href="/css/fluent/studyflow-fluent-tokens.css">
  <link rel="stylesheet" href="/css/fluent/fluent-global.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <img src="/assets/logo.svg" width="40" height="40" alt="">
        <div>
          <strong>StudyFlow</strong>
          <span>AI 学习工作台</span>
        </div>
      </div>

      <div class="login-heading">
        <p class="login-eyebrow">管理员访问</p>
        <h1 id="login-title">登录 StudyFlow</h1>
        <p class="login-subtitle">输入管理员密码以进入学习工作台。</p>
      </div>

      <div class="login-error" id="login-error" role="alert" hidden></div>

      <form class="login-form" id="login-form" action="/login" method="post">
        <input type="hidden" name="next" id="login-next" value="/">
        <label class="login-field" for="password">
          <span>管理员密码</span>
          <span class="login-password-wrap">
            <input
              class="input login-password"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="输入管理员密码"
              required
              autofocus
              aria-describedby="login-hint"
            >
            <button
              class="login-reveal"
              id="toggle-password"
              type="button"
              aria-controls="password"
              aria-pressed="false"
            >显示</button>
          </span>
        </label>

        <button class="login-submit" id="login-submit" type="submit">登录</button>
      </form>

      <p class="login-hint" id="login-hint">仅限 StudyFlow 管理员使用。没有注册入口，也不保存明文密码。</p>
    </section>

    <footer class="login-footer">
      <span>StudyFlow · 本地学习空间</span>
      <span>受 Session 访问控制保护</span>
    </footer>
  </main>
  <script src="/js/login.js" defer></script>
</body>
</html>
