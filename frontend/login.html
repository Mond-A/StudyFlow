<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3f2f1">
  <title>登录 · StudyFlow</title>
  <script>
    (function () {
      try {
        var follow = localStorage.getItem("studyflow.settings.follow-system");
        var stored = localStorage.getItem("studyflow.settings.theme");
        var dark = follow === "false"
          ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) {
          document.documentElement.dataset.theme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#202020";
        }
      } catch (_) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="stylesheet" href="/css/fluent/studyflow-fluent-tokens.css">
  <link rel="stylesheet" href="/css/fluent/fluent-global.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <img src="/assets/logo.svg" width="40" height="40" alt="">
        <div>
          <strong>StudyFlow</strong>
          <span>AI 学习工作台</span>
        </div>
      </div>

      <div class="login-heading">
        <p class="login-eyebrow">学习账户</p>
        <h1 id="login-title">登录 StudyFlow</h1>
        <p class="login-subtitle">使用邮箱登录，或创建新的学习账户。</p>
      </div>

      <div class="login-tabs" role="tablist" aria-label="账户操作">
        <button class="login-tab is-active" id="tab-login" type="button" role="tab" aria-selected="true" data-auth-mode="login">邮箱登录</button>
        <button class="login-tab" id="tab-register" type="button" role="tab" aria-selected="false" data-auth-mode="register">注册账户</button>
      </div>

      <div class="login-error" id="login-error" role="alert" hidden></div>
      <div class="login-status" id="login-status" role="status" hidden></div>

      <form class="login-form" id="login-form" action="/login" method="post">
        <input type="hidden" name="next" id="login-next" value="/">
        <label class="login-field" for="email">
          <span>邮箱</span>
          <input
            class="input login-input"
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="you@example.com"
            required
            autofocus
          >
        </label>
        <label class="login-field" for="password">
          <span>密码</span>
          <span class="login-password-wrap">
            <input
              class="input login-password"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="输入账户密码"
              required
            >
            <button
              class="login-reveal"
              id="toggle-password"
              type="button"
              aria-controls="password"
              aria-pressed="false"
            >显示</button>
          </span>
        </label>
        <button class="login-submit" id="login-submit" type="submit">登录</button>
        <button class="login-resend" id="resend-verification" type="button" hidden>重新发送验证邮件</button>
      </form>

      <form class="login-form" id="register-form" action="/api/auth/register" method="post" hidden>
        <label class="login-field" for="register-name">
          <span>显示名称（可选）</span>
          <input class="input login-input" id="register-name" name="display_name" type="text" autocomplete="nickname" maxlength="80" placeholder="例如：小林">
        </label>
        <label class="login-field" for="register-email">
          <span>邮箱</span>
          <input class="input login-input" id="register-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <label class="login-field" for="register-password">
          <span>密码（至少 12 个字符）</span>
          <input class="input login-input" id="register-password" name="password" type="password" autocomplete="new-password" minlength="12" required>
        </label>
        <label class="login-field" for="register-confirm">
          <span>确认密码</span>
          <input class="input login-input" id="register-confirm" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
        </label>
        <button class="login-submit" id="register-submit" type="submit">创建账户</button>
      </form>

      <p class="login-hint" id="login-hint">登录邮箱需要先完成邮箱验证。密码不会以明文保存。</p>
      <div class="login-guest">
        <a class="login-guest-link" href="/guest">不注册，先以访客身份使用</a>
        <span>访客数据只保存在当前设备；清除浏览器数据或更换设备可能丢失，智能工具需登录后使用。</span>
      </div>
    </section>

    <footer class="login-footer">
      <span>StudyFlow · 个人学习空间</span>
      <span>受 Session 访问控制保护</span>
    </footer>
  </main>
  <script src="/js/login.js" defer></script>
</body>
</html>
