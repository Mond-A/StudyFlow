<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3f2f1">
  <title>进入访客模式 · StudyFlow</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="stylesheet" href="/css/fluent/studyflow-fluent-tokens.css">
  <link rel="stylesheet" href="/css/fluent/fluent-global.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="guest-switch-title">
      <div class="login-brand">
        <img src="/assets/logo.svg" width="40" height="40" alt="">
        <div>
          <strong>StudyFlow</strong>
          <span>访客本地学习空间</span>
        </div>
      </div>

      <div class="login-heading">
        <p class="login-eyebrow">访客模式</p>
        <h1 id="guest-switch-title">进入访客模式？</h1>
        <p class="login-subtitle">__GUEST_SWITCH_ACCOUNT_NOTE__ 访客数据只会保存在当前浏览器，不会自动上传到服务器。</p>
      </div>

      <div class="guest-switch-warning" role="note">
        <strong>请确认</strong>
        <p>访客数据与正式账户完全分离。清除浏览器数据或更换设备可能导致访客数据丢失；智能工具需要登录正式账户后使用。</p>
      </div>

      <form class="login-form" action="/guest" method="post">
        <input type="hidden" name="csrf_token" value="__GUEST_SWITCH_TOKEN__">
        <button class="login-submit" type="submit">进入访客模式</button>
      </form>

      <p class="login-hint"><a class="guest-switch-back" href="/login">返回邮箱登录</a>。进入访客模式后，原正式账户的当前 Session 将被清除。</p>
    </section>

    <footer class="login-footer">
      <span>StudyFlow · 当前设备</span>
      <span>访客数据不会自动同步</span>
    </footer>
  </main>
</body>
</html>
